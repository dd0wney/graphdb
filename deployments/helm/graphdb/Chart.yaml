# was live-verified against 1.2.0-era behaviour (mmap-default + JWT-fail-closed).
appVersion: "1.4.0"
home: https://github.com/dd0wney/graphdb
sources:
  - https://github.com/dd0wney/graphdb
maintainers:
  - name: dd0wney
kubeVersion: ">=1.23.0-0"
