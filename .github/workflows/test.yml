name: Tests

on:
  push:
    branches: [ main, develop ]
  # No branch filter on pull_request. A stacked pull request has a base that is
  # not main, and a filter here means it runs no tests and no lint at all. That
  # is not a red tick, it is no tick: PR #512 ran 1 check against its stack base
  # and 10 against main, on the identical commit.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Go ${{ matrix.go-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # go.mod declares `go 1.27.0` (build floor). Pin the runner to
        # match so setup-go's GOTOOLCHAIN=local is satisfied without a
        # toolchain download. The earlier 1.26.4 pin closed two reachable
        # stdlib advisories (security audit H-9); 1.27.0 carries those
        # fixes, re-checked with govulncheck in the 1.27 adoption gate.
        go-version: ['1.27.0']
        # Ubuntu runners hit external-SIGTERM exit-143 on test-verbose/test-race
        # consistently (CLAUDE.md § "Known infra patterns"; NEXT_STEPS_2026-05-13.md
        # § Track H). macOS-only matrix until the contention root cause is addressed.
        # Build/tagged-build jobs below stay on ubuntu-latest (short-running; produce
        # Linux artifacts; not subject to the SIGTERM pattern).
        os: [macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
        cache-dependency-path: go.sum

    - name: Verify dependencies
      run: |
        go mod verify
        go mod download

    - name: Run go vet
      run: go vet ./...

    - name: Run go fmt check
      # gofmt -s, not go fmt. .golangci.yml sets gofmt.simplify, so the lint job
      # rejects what plain gofmt accepts — an empty import () block, for one.
      # This step used `go fmt ./...` and passed a tree the lint job then failed
      # (PR #485). Two format gates that disagree cost a round trip every time
      # the weaker one is the one a developer runs. -l also reports rather than
      # rewriting, which is what a check should do.
      #
      # Scoped to pkg and cmd. enterprise-plugins is not gofmt -s clean (16
      # files), and golangci-lint does not reach it either: prometheus-metrics
      # has its own go.mod, and r2-backup does not load because its AWS imports
      # are not in go.mod. Widening this check is a separate change from
      # repairing that directory.
      run: |
        unformatted=$(gofmt -s -l ./pkg ./cmd)
        if [ -n "$unformatted" ]; then
          echo "The following files under pkg or cmd are not gofmt -s clean:"
          echo "$unformatted"
          exit 1
        fi
        echo "pkg and cmd are gofmt -s clean"

    - name: Run tests
      run: make test-verbose

    - name: Run tests with race detector
      run: make test-race

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.0'
        cache: true

    - name: Run tests with coverage, and enforce the floor
      # coverage-gate depends on test-cover, so this runs the suite and then
      # checks the total against COVERAGE_MIN. One step keeps the floor in the
      # Makefile only — a copy of the number here would drift from it.
      run: make coverage-gate

    - name: Check the consumer contracts against their tests
      # Cheap and independent of the build, so it runs beside coverage rather
      # than in its own job. It fails if the registry and the tagged tests stop
      # describing each other, or if a guarding test's body changed without the
      # lock file changing with it.
      run: make contract-guard

    - name: Prove the contract guard can fail
      # A gate nobody has seen report the negative is not known to be a gate.
      run: make contract-guard-selftest

    - name: Enforce the per-package coverage floors
      # The global floor lets a well-covered package hide a poor one: pkg/query
      # at 63.0% and pkg/parallel at 93.4% clear the same 74.0% gate together.
      # The floors in coverage-floors.tsv came from this job on main, which is
      # the only environment whose numbers may set them.
      run: make coverage-floors

    - name: Prove the per-package gate can report a failure
      run: make coverage-floors-selftest

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage/coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Archive coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/
        retention-days: 30

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.0'
        cache: true

    - name: Run benchmarks
      run: make bench

    - name: Archive benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results
        path: coverage/
        retention-days: 7

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.0'
        cache: true

    - name: Build all binaries
      run: make build-all

    - name: Upload binaries
      uses: actions/upload-artifact@v7
      with:
        name: binaries-linux
        path: bin/
        retention-days: 7

  cgo-free:
    name: Pure Go (no cgo)
    runs-on: ubuntu-latest
    # Replaces the former "Tagged Build (-tags nng)" job, which compiled an
    # IDENTICAL file set to the ordinary build. `go list -tags nng` and
    # `go list` returned the same GoFiles for all 83 packages: no file in the
    # repo carries an nng build constraint. The job was added in #66 to
    # exercise the surviving replication variant, and #130/#133 deleted that
    # code — the job outlived it and had been reporting green about nothing.
    #
    # This job checks a property that is real, load-bearing, and currently
    # true: graphdb contains no cgo. That is what keeps a whole class of
    # defect out of the codebase — the manual C.free ownership rules, the
    # pointer-passing rules, and the buffer overruns that valgrind and the
    # sanitizers exist to find (go.dev/wiki/cgo). It is also what makes
    # SQLite's techniques 13 and 14 inapplicable here rather than skipped.
    #
    # If cgo is ever introduced deliberately, this job is the place to record
    # that decision, and the testing regime has to grow -msan/-asan coverage
    # with it.

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.0'
        cache: true

    - name: No package may import "C"
      run: |
        set -uo pipefail
        # go list reports CgoFiles per package; any non-zero count is cgo.
        if ! go list -f '{{.ImportPath}} {{len .CgoFiles}}' ./... > /tmp/pkgs.txt 2>/tmp/pkgs.err; then
          echo "::error::go list failed — this check cannot report anything, so it fails"
          cat /tmp/pkgs.err
          exit 1
        fi
        # Positive control. Without it, a go list that enumerates nothing
        # produces an empty offender list and the job reports success while
        # inspecting zero packages.
        count=$(wc -l < /tmp/pkgs.txt)
        if [ "$count" -lt 50 ]; then
          echo "::error::go list enumerated only $count packages; expected the whole module (~83). Refusing to report a pass."
          exit 1
        fi
        offenders=$(awk '$2 != "0" { print $1 }' /tmp/pkgs.txt)
        if [ -n "$offenders" ]; then
          echo "::error::these packages use cgo:"
          echo "$offenders"
          exit 1
        fi
        echo "no package imports \"C\" across $count packages"

    - name: The whole module builds with CGO_ENABLED=0
      # goreleaser and both Dockerfiles already set CGO_ENABLED=0, so a cgo
      # dependency would break release builds rather than CI. This makes that
      # failure land on the PR that introduces it.
      run: CGO_ENABLED=0 go build ./...

  simd-smoke:
    name: SIMD smoke (amd64, GOEXPERIMENT=simd)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.0'
        cache: true

    # Gate 0 de-risk: confirm the experimental amd64-only simd/archsimd path
    # compiles and runs. GOEXPERIMENT=simd activates the goexperiment.simd build
    # tag; without it the smoke test skips (the kernel is build-tag isolated).
    - name: Run archsimd smoke test
      env:
        GOEXPERIMENT: simd
      run: go test ./pkg/vector/ -run TestSIMDSmokeAddMatchesScalar -v
