name: Lint

on:
  push:
    branches: [ main, develop ]
  # No branch filter on pull_request. A stacked pull request has a base that is
  # not main, and a filter here means it runs no tests and no lint at all. That
  # is not a red tick, it is no tick: PR #512 ran 1 check against its stack base
  # and 10 against main, on the identical commit.
  pull_request:

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.0'
        # setup-go's cache stays on: golangci-lint-action v5+ caches only
        # its own analysis data and delegates Go module/build caching here.

    - name: Run golangci-lint
      # @v4-@v6 only support golangci-lint v1. The repo's
      # .golangci.yml is v2 format, so we need @v7+ which added
      # golangci-lint v2 support. Pin to v2.13.2: v2.13.0 is the
      # first release built against go1.27, and a golangci-lint built
      # with an older Go cannot typecheck a `go 1.27.0` module.
      # Verified with `config verify` locally. "latest" is avoided so
      # a schema change cannot break the gate silently.
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2
        args: --timeout=5m
        only-new-issues: false
        skip-cache: false

  go-mod-tidy:
    name: Check go.mod and go.sum
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.0'

    - name: Check if go.mod is tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum
        if [ $? -ne 0 ]; then
          echo "❌ go.mod or go.sum needs tidying"
          echo "Run: go mod tidy"
          exit 1
        fi
        echo "✅ go.mod and go.sum are tidy"

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Run Gosec Security Scanner
      # Pinned: @master is a mutable ref (upstream pushes change CI
      # behavior with no diff here to bisect against).
      uses: securego/gosec@v2.28.0
      with:
        args: '-no-fail -fmt=json -out=results.json ./...'

    - name: Upload security results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: security-scan-results
        path: results.json
        retention-days: 30
